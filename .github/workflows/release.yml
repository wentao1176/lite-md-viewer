name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Vue
        run: npx vite build

      - name: Build & Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish always 2>&1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
