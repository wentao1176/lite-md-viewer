appId: com.xwt.lite-md-viewer
productName: lite-md-viewer
copyright: Copyright © 2025 xwt

directories:
  output: release

publish:
  provider: github
  owner: wentao1176
  repo: lite-md-viewer

files:
  - dist/**/*
  - dist-electron/**/*

win:
  icon: build/icons/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: lite-md-viewer

linux:
  category: Utility
  icon: build/icons/icon.png
  maintainer: xwt <wentao1176@users.noreply.github.com>
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  artifactName: ${productName}_${version}_${arch}.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
